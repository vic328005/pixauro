<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Pixauro App 图标 · 1024×1024
       圆角方底 824×824 居中（四周留 100px，按 macOS 图标模板），透明背景。
       标志 9×9 像素，每像素 56px，与底纹棋盘格对齐。 -->
  <defs>
    <clipPath id="shape">
      <rect x="100" y="100" width="824" height="824" rx="185"/>
    </clipPath>
    <linearGradient id="base" x1="0" y1="100" x2="0" y2="924" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2a2a2e"/>
      <stop offset="1" stop-color="#161618"/>
    </linearGradient>
    <pattern id="checker" x="260" y="260" width="112" height="112" patternUnits="userSpaceOnUse">
      <rect width="56" height="56" fill="#ffffff" fill-opacity="0.03"/>
      <rect x="56" y="56" width="56" height="56" fill="#ffffff" fill-opacity="0.03"/>
    </pattern>
    <!-- 中心提亮用中性白，不用金色：金色叠在灰上会变土 -->
    <radialGradient id="lift" cx="512" cy="480" r="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="512" cy="470" r="620" gradientUnits="userSpaceOnUse">
      <stop offset="0.55" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.35"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="100" x2="0" y2="924" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
    <filter id="drop" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <filter id="lift-mark" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- 底 -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#base)" filter="url(#drop)"/>
  <g clip-path="url(#shape)">
    <rect x="100" y="100" width="824" height="824" fill="url(#checker)"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#lift)"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#vignette)"/>
  </g>
  <rect x="100.75" y="100.75" width="822.5" height="822.5" rx="184.25" fill="none" stroke="url(#rim)" stroke-width="1.5"/>

  <!-- 标志 ☉：三色金，柔和投影把它从底上托起来 -->
  <g filter="url(#lift-mark)">
  <g transform="translate(260 260) scale(56)" shape-rendering="crispEdges">
    <path fill="#e5b85c" d="M4 0h3v1H4zM7 1h1v1H7zM8 2h1v3H8zM0 4h1v3H0zM1 7h1v1H1zM2 8h1v1H2z"/>
    <path fill="#efd49d" d="M2 0h2v1H2zM1 1h1v1H1zM0 2h1v2H0zM4 4h1v1H4z"/>
    <path fill="#a08140" d="M8 5h1v2H8zM7 7h1v1H7zM3 8h4v1H3z"/>
  </g>
  </g>
</svg>
